name: Verify

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  windows-verify:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Game Projects/CodexGameAssetWorkbench
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          path: Game Projects/CodexGameAssetWorkbench

      - name: Use Node.js 24.13.0
        uses: actions/setup-node@v4
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: Game Projects/CodexGameAssetWorkbench/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Inspect dependency tree
        run: npm ls --depth=0

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run repository verification
        run: npm run verify
